<svg width="700" height="180" viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .cell { opacity: 0; animation: pop .5s ease forwards; }
    .c1{animation-delay:.1s;} .c2{animation-delay:.25s;} .c3{animation-delay:.4s;}
    .c4{animation-delay:.55s;} .c5{animation-delay:.7s;}
    @keyframes pop { 0%{opacity:0; transform:scale(.6);} 70%{transform:scale(1.05);} 100%{opacity:1; transform:scale(1);} }
    .lbl { font-family: 'Trebuchet MS', sans-serif; fill: #C4B5FD; font-size: 12px; }
    .rank { font-family: 'Courier New', monospace; fill: #F0ABFC; font-size: 20px; font-weight: bold; }
  </style>
  <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="700" height="180" rx="16" fill="#0D0221" stroke="#8B5CF6" stroke-opacity="0.4"/>

<g class="cell c1"><rect x="24" y="30" width="112" height="120" rx="10" fill="#3B1264"/><text x="80" y="90" text-anchor="middle" font-size="30">🏆</text><text x="80" y="115" text-anchor="middle" class="rank">S</text><text x="80" y="135" text-anchor="middle" class="lbl">Commits</text></g>
<g class="cell c2"><rect x="148" y="30" width="112" height="120" rx="10" fill="#3B1264"/><text x="204" y="90" text-anchor="middle" font-size="30">⭐</text><text x="204" y="115" text-anchor="middle" class="rank">A+</text><text x="204" y="135" text-anchor="middle" class="lbl">Stars</text></g>
<g class="cell c3"><rect x="272" y="30" width="112" height="120" rx="10" fill="#3B1264"/><text x="328" y="90" text-anchor="middle" font-size="30">🔥</text><text x="328" y="115" text-anchor="middle" class="rank">A</text><text x="328" y="135" text-anchor="middle" class="lbl">Streak</text></g>
<g class="cell c4"><rect x="396" y="30" width="112" height="120" rx="10" fill="#3B1264"/><text x="452" y="90" text-anchor="middle" font-size="30">🧩</text><text x="452" y="115" text-anchor="middle" class="rank">A+</text><text x="452" y="135" text-anchor="middle" class="lbl">Repos</text></g>
<g class="cell c5"><rect x="520" y="30" width="112" height="120" rx="10" fill="#3B1264"/><text x="576" y="90" text-anchor="middle" font-size="30">🤝</text><text x="576" y="115" text-anchor="middle" class="rank">B+</text><text x="576" y="135" text-anchor="middle" class="lbl">PRs</text></g>

<rect x="0" y="0" width="140" height="180" fill="url(#shine)">
  <animate attributeName="x" values="-140;700" dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
</rect>
<text x="24" y="170" font-family="Trebuchet MS" font-size="11" fill="#6D28D9">local card · ranks illustrative, edit manually</text>
</svg>
