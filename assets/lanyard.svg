<svg width="320" height="480" viewBox="0 0 320 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2E0854"/>
    <stop offset="100%" stop-color="#0D0221"/>
  </linearGradient>
  <clipPath id="face"><circle cx="160" cy="130" r="46"/></clipPath>
  <style>
    .mono { font-family: 'Courier New', monospace; }
    .sans { font-family: 'Trebuchet MS', sans-serif; }
  </style>
</defs>

<!-- pivot + swinging assembly (damped pendulum: wide swing settling to rest) -->
<g transform-origin="160 20">
  <animateTransform attributeName="transform" type="rotate"
    values="0 160 20; 9 160 20; -7 160 20; 5 160 20; -3 160 20; 1.5 160 20; 0 160 20"
    keyTimes="0; 0.18; 0.38; 0.56; 0.72; 0.86; 1"
    dur="6s" repeatCount="indefinite"/>

  <!-- clasp -->
  <circle cx="160" cy="20" r="8" fill="#8B5CF6"/>
  <rect x="156" y="20" width="8" height="14" fill="#8B5CF6"/>

  <!-- strap -->
  <rect x="150" y="30" width="20" height="90" rx="6" fill="#EC4899"/>
  <text x="160" y="80" text-anchor="middle" class="mono" font-size="9" fill="#FCE7F3" transform="rotate(90 160 80)">MAIYLSAMY</text>

  <!-- metal ring -->
  <circle cx="160" cy="128" r="10" fill="none" stroke="#C4B5FD" stroke-width="4"/>

  <!-- card -->
  <g>
    <rect x="60" y="136" width="200" height="300" rx="18" fill="url(#cardGlow)" stroke="#8B5CF6" stroke-width="2"/>

    <!-- avatar ring -->
    <circle cx="160" cy="210" r="52" fill="none" stroke="#EC4899" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g clip-path="url(#face)" transform="translate(0,80)">
      <!-- REPLACE this rect with: <image href="data:image/png;base64,YOUR_BASE64" x="114" y="164" width="92" height="92"/> -->
      <rect x="114" y="164" width="92" height="92" fill="#4C1D95"/>
    </g>

    <text x="160" y="300" text-anchor="middle" class="sans" font-size="20" font-weight="bold" fill="#E9D5FF">Maiylsamy Durai</text>
    <text x="160" y="322" text-anchor="middle" class="mono" font-size="13" fill="#C4B5FD">Python Backend Developer</text>
    <text x="160" y="344" text-anchor="middle" class="mono" font-size="12" fill="#F0ABFC">@Maiylsamy</text>

    <!-- barcode -->
    <g fill="#C4B5FD">
      <rect x="90" y="365" width="2" height="24"/><rect x="95" y="365" width="4" height="24"/>
      <rect x="102" y="365" width="1" height="24"/><rect x="106" y="365" width="3" height="24"/>
      <rect x="112" y="365" width="2" height="24"/><rect x="118" y="365" width="5" height="24"/>
      <rect x="126" y="365" width="1" height="24"/><rect x="130" y="365" width="2" height="24"/>
      <rect x="136" y="365" width="4" height="24"/><rect x="143" y="365" width="1" height="24"/>
      <rect x="148" y="365" width="3" height="24"/><rect x="154" y="365" width="2" height="24"/>
      <rect x="160" y="365" width="5" height="24"/><rect x="168" y="365" width="1" height="24"/>
      <rect x="172" y="365" width="2" height="24"/><rect x="178" y="365" width="4" height="24"/>
      <rect x="185" y="365" width="1" height="24"/><rect x="190" y="365" width="3" height="24"/>
      <rect x="196" y="365" width="2" height="24"/><rect x="202" y="365" width="4" height="24"/>
      <rect x="210" y="365" width="1" height="24"/><rect x="215" y="365" width="2" height="24"/>
      <rect x="220" y="365" width="3" height="24"/><rect x="226" y="365" width="1" height="24"/>
    </g>

    <!-- holographic sweep -->
    <rect x="60" y="136" width="60" height="300" fill="#F0ABFC" opacity="0.12">
      <animate attributeName="x" values="60;260;60" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>
</svg>
