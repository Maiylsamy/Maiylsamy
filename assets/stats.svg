<svg width="450" height="220" viewBox="0 0 450 220" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#EC4899"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>
  <style>
    .lbl { font-family: 'Trebuchet MS', sans-serif; fill: #C4B5FD; font-size: 14px; }
    .val { font-family: 'Courier New', monospace; fill: #F0ABFC; font-size: 15px; font-weight: bold; }
    .row { opacity: 0; animation: slideIn .5s ease forwards; }
    .r1 { animation-delay: .2s; } .r2 { animation-delay: .4s; }
    .r3 { animation-delay: .6s; } .r4 { animation-delay: .8s; }
    @keyframes slideIn { from { opacity:0; transform: translateX(-20px);} to { opacity:1; transform: translateX(0);} }
  </style>
</defs>
<rect width="450" height="220" rx="16" fill="#0D0221" stroke="#8B5CF6" stroke-opacity="0.4"/>
<text x="24" y="36" font-family="Trebuchet MS" font-size="18" font-weight="bold" fill="#E9D5FF">GitHub Stats</text>

<!-- rank ring -->
<g transform="translate(365,70)">
  <circle r="42" fill="none" stroke="#2E0854" stroke-width="8"/>
  <circle r="42" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round"
    stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="264" to="60" dur="1.6s" begin="0.3s" fill="freeze"/>
  </circle>
  <text text-anchor="middle" dy="6" font-family="Courier New" font-size="20" fill="#F0ABFC">A+</text>
</g>

<g class="row r1"><text x="24" y="80" class="lbl">Total Stars</text><text x="220" y="80" class="val">— update me —</text></g>
<g class="row r2"><text x="24" y="112" class="lbl">Total Commits</text><text x="220" y="112" class="val">— update me —</text></g>
<g class="row r3"><text x="24" y="144" class="lbl">Total PRs</text><text x="220" y="144" class="val">— update me —</text></g>
<g class="row r4"><text x="24" y="176" class="lbl">Contributed To</text><text x="220" y="176" class="val">— update me —</text></g>

<text x="24" y="205" font-family="Trebuchet MS" font-size="11" fill="#6D28D9">local card · edit values manually</text>
</svg>
