<svg width="450" height="220" viewBox="0 0 450 220" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#EC4899"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>
  <style>
    .lbl { font-family: 'Trebuchet MS', sans-serif; fill: #E9D5FF; font-size: 14px; }
    .pct { font-family: 'Courier New', monospace; fill: #C4B5FD; font-size: 13px; }
  </style>
</defs>
<rect width="450" height="220" rx="16" fill="#0D0221" stroke="#8B5CF6" stroke-opacity="0.4"/>
<text x="24" y="36" font-family="Trebuchet MS" font-size="18" font-weight="bold" fill="#E9D5FF">Most Used Languages</text>

<g>
  <text x="24" y="66" class="lbl">Python</text>
  <rect x="24" y="74" width="380" height="10" rx="5" fill="#2E0854"/>
  <rect x="24" y="74" width="0" height="10" rx="5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="290" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="410" y="82" class="pct">76%</text>
</g>

<g>
  <text x="24" y="106" class="lbl">JavaScript</text>
  <rect x="24" y="114" width="380" height="10" rx="5" fill="#2E0854"/>
  <rect x="24" y="114" width="0" height="10" rx="5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="60" dur="1.2s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="410" y="122" class="pct">16%</text>
</g>

<g>
  <text x="24" y="146" class="lbl">HTML/CSS</text>
  <rect x="24" y="154" width="380" height="10" rx="5" fill="#2E0854"/>
  <rect x="24" y="154" width="0" height="10" rx="5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="26" dur="1.2s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="410" y="162" class="pct">7%</text>
</g>

<g>
  <text x="24" y="186" class="lbl">Shell</text>
  <rect x="24" y="194" width="380" height="10" rx="5" fill="#2E0854"/>
  <rect x="24" y="194" width="0" height="10" rx="5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="10" dur="1.2s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="410" y="202" class="pct">1%</text>
</g>

<text x="24" y="216" font-family="Trebuchet MS" font-size="11" fill="#6D28D9">local card · edit percentages manually</text>
</svg>
